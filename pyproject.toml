[project]
name = "agent-failure"
version = "0.1.0"
description = "An instrumented security lab for learning attacks and defenses against LLM-powered agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.40.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "kubernetes>=35.0.0",
    "openai>=2.23.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
    "websockets>=17.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "import-linter>=2.11",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.5",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
norecursedirs = []
markers = [
    "integration: marks tests as integration tests",
]

[tool.mypy]
exclude = ""
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["apps.control_plane.src.*"]
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true
