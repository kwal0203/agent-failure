services:
  caddy:
    image: caddy:2.9
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane-api

  control-plane-api:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    expose:
      - "8000"

  evaluator-worker:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.evaluator.src.interfaces.runtime.evaluator_worker"]

  session-objective-completed-worker:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.session_objective_completed_worker"]

  session-hint-unlock-worker:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.session_hint_unlock_worker"]

  session-completed-worker:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.session_completed_worker"]

  session-feedback-created-worker:
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.session_feedback_created_worker"]

  # Optional: only enable this if you actually run runtime provisioning from this host
  # and have compatible infra credentials/connectivity.
  provisioning-worker:
    profiles: ["k8s-workers"]
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.provisioning_worker"]

  cleanup-worker:
    profiles: ["k8s-workers"]
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.cleanup_worker"]

  runtime-inspection-worker:
    profiles: ["k8s-workers"]
    build:
      context: ../..
      dockerfile: apps/control_plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["uv", "run", "python", "-m", "apps.control_plane.src.interfaces.runtime.runtime_inspection_worker"]

volumes:
  caddy_data:
  caddy_config:
