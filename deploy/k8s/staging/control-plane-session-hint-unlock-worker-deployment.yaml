apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-session-hint-unlock-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-session-hint-unlock-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-session-hint-unlock-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-session-hint-unlock-worker
    spec:
      containers:
        - name: session-hint-unlock-worker
          image: ghcr.io/kwal0203/agent-failure-control-plane@sha256:1c192d650cd3ebaff1fcbc3202433f9a15ff3b9bb60b0d3bc1746fbcc296bb1e
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.control_plane.src.interfaces.runtime.session_hint_unlock_worker
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:localdev@172.17.0.1:5432/agent_failure"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: ghcr-pull
