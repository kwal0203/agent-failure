apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: ghcr.io/kwal0203/agent-failure-control-plane@sha256:6a605e31dc235f3a17d1e267bf5caf21fec4de442ef3232683a96cbf134eb3bc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:localdev@172.17.0.1:5432/agent_failure"
            - name: RUNTIME_AUTH_TOKEN
              value: "dev-secret"
            - name: RUNTIME_TIMEOUT_SECONDS
              value: "60"
            - name: PROVIDER_ENDPOINT
              value: "https://openrouter.ai/api/v1/chat/completions"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: MODEL_NAME
              value: "deepseek/deepseek-v3.2"
            - name: MODEL_TIMEOUT
              value: "30"
            - name: AUTH_ISSUER
              value: ""
            - name: AUTH_AUDIENCE
              value: ""
            - name: AUTH_JWKS_URI
              value: ""
            - name: AUTH_JWKS_CACHE_TTL_SECONDS
              value: "300"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-pull
