apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
      imagePullSecrets:
        - name: ghcr-pull
