apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: AUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_AUDIENCE
            - name: AUTH_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_JWKS_URI
      containers:
        - name: control-plane
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: AUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_AUDIENCE
            - name: AUTH_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_JWKS_URI
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "600m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
      imagePullSecrets:
        - name: ghcr-pull
