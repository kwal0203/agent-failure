apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-evaluator-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-evaluator-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-evaluator-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-evaluator-worker
    spec:
      containers:
        - name: evaluator-worker
          image: ghcr.io/kwal0203/agent-failure-control-plane@sha256:1c84d669d4316220bdc13ea3e4ef55102a3bb511a03e1101f95a061f39929a61
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.evaluator.src.interfaces.runtime.evaluator_worker
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:localdev@172.17.0.1:5432/agent_failure"
            - name: PROVIDER_ENDPOINT
              value: "https://openrouter.ai/api/v1/chat/completions"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: MODEL_NAME
              value: "deepseek/deepseek-v3.2"
            - name: MODEL_TIMEOUT
              value: "30"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: ghcr-pull
