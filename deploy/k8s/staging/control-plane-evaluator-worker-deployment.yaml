apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-evaluator-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-evaluator-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-evaluator-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-evaluator-worker
    spec:
      containers:
        - name: evaluator-worker
          image: ghcr.io/kwal0203/agent-failure-control-plane@sha256:4e3c5da740a1f72fbd5c135d43120ed41a5773ce38c9ee752dadc2ba286dd8bf
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.evaluator.src.interfaces.runtime.evaluator_worker
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:localdev@172.17.0.1:5432/agent_failure"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: ghcr-pull
