apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-session-objective-completed-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-session-objective-completed-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-session-objective-completed-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-session-objective-completed-worker
    spec:
      containers:
        - name: session-objective-completed-worker
          image: ghcr.io/kwal0203/agent-failure-control-plane@sha256:11745b0b2430f6812d3954730d6330990e5bb61785e2814637034c6da7e50c59
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.control_plane.src.interfaces.runtime.session_objective_completed_worker
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://postgres:localdev@172.17.0.1:5432/agent_failure"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: ghcr-pull
