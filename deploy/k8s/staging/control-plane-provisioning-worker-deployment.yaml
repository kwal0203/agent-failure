apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-provisioning-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-provisioning-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-provisioning-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-provisioning-worker
    spec:
      serviceAccountName: control-plane-worker
      containers:
        - name: provisioning-worker
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.control_plane.src.interfaces.runtime.provisioning_worker
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      imagePullSecrets:
        - name: ghcr-pull
