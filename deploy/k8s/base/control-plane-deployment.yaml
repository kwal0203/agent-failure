                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_USERNAME
            - name: PILOT_PROVISIONING_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_PASSWORD
            - name: PILOT_PROVISIONING_EMAIL_SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_STARTTLS
            - name: PILOT_PROVISIONING_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_FROM
            - name: PILOT_PROVISIONING_EMAIL_ADMIN_TO
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_ADMIN_TO
            - name: PILOT_PROVISIONING_ONBOARDING_LOGIN_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_ONBOARDING_LOGIN_URL
            - name: PILOT_PROVISIONING_ONBOARDING_QUICKSTART_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_ONBOARDING_QUICKSTART_URL
            - name: INSTRUCTOR_PROVISIONING_ENABLED
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: INSTRUCTOR_PROVISIONING_ENABLED
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_REGION
            - name: COGNITO_INSTRUCTOR_GROUP_NAME
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_INSTRUCTOR_GROUP_NAME
      containers:
        - name: control-plane
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: AUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_AUDIENCE
            - name: AUTH_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_JWKS_URI
            - name: ENROLLMENT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: ENROLLMENT_TOKEN_SECRET
            - name: ENROLLMENT_TOKEN_TTL_SECONDS
