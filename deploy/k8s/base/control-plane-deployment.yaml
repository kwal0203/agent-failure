apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/kwal0203/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
            - name: RUNTIME_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: RUNTIME_SHARED_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: OPENROUTER_API_KEY
            - name: AUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_AUDIENCE
            - name: AUTH_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: AUTH_JWKS_URI
            - name: ENROLLMENT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: ENROLLMENT_TOKEN_SECRET
            - name: ENROLLMENT_TOKEN_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: ENROLLMENT_TOKEN_TTL_SECONDS
            - name: PILOT_ALERT_EMAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_ENABLED
            - name: PILOT_ALERT_EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_HOST
            - name: PILOT_ALERT_EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_PORT
            - name: PILOT_ALERT_EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_USERNAME
            - name: PILOT_ALERT_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_PASSWORD
            - name: PILOT_ALERT_EMAIL_SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_STARTTLS
            - name: PILOT_ALERT_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_FROM
            - name: PILOT_ALERT_EMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_TO
            - name: PILOT_PROVISIONING_EMAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_ENABLED
            - name: PILOT_PROVISIONING_EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_HOST
            - name: PILOT_PROVISIONING_EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_PORT
            - name: PILOT_PROVISIONING_EMAIL_SMTP_USERNAME
