                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_ENABLED
            - name: PILOT_ALERT_EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_HOST
            - name: PILOT_ALERT_EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_PORT
            - name: PILOT_ALERT_EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_USERNAME
            - name: PILOT_ALERT_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_PASSWORD
            - name: PILOT_ALERT_EMAIL_SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_SMTP_STARTTLS
            - name: PILOT_ALERT_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_FROM
            - name: PILOT_ALERT_EMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_ALERT_EMAIL_TO
            - name: PILOT_PROVISIONING_EMAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_ENABLED
            - name: PILOT_PROVISIONING_EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_HOST
            - name: PILOT_PROVISIONING_EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_PORT
            - name: PILOT_PROVISIONING_EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_USERNAME
            - name: PILOT_PROVISIONING_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_PASSWORD
            - name: PILOT_PROVISIONING_EMAIL_SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_SMTP_STARTTLS
            - name: PILOT_PROVISIONING_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_FROM
            - name: PILOT_PROVISIONING_EMAIL_ADMIN_TO
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_EMAIL_ADMIN_TO
            - name: PILOT_PROVISIONING_ONBOARDING_LOGIN_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_ONBOARDING_LOGIN_URL
            - name: PILOT_PROVISIONING_ONBOARDING_QUICKSTART_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: PILOT_PROVISIONING_ONBOARDING_QUICKSTART_URL
            - name: INSTRUCTOR_PROVISIONING_ENABLED
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: INSTRUCTOR_PROVISIONING_ENABLED
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_REGION
            - name: COGNITO_INSTRUCTOR_GROUP_NAME
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: COGNITO_INSTRUCTOR_GROUP_NAME
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "600m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
      imagePullSecrets:
        - name: ghcr-pull
