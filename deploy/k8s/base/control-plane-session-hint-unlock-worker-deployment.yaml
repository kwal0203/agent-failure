apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-session-hint-unlock-worker
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: control-plane-session-hint-unlock-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-session-hint-unlock-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-session-hint-unlock-worker
    spec:
      containers:
        - name: session-hint-unlock-worker
          image: ghcr.io/example/agent-failure-control-plane
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - python
            - -m
            - apps.control_plane.src.interfaces.runtime.session_hint_unlock_worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
      imagePullSecrets:
        - name: ghcr-pull
