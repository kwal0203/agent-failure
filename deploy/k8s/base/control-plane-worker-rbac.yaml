apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-worker
  namespace: runtime-pool
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-worker-role
  namespace: runtime-pool
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-worker-binding
  namespace: runtime-pool
subjects:
  - kind: ServiceAccount
    name: control-plane-worker
    namespace: runtime-pool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-worker-role
