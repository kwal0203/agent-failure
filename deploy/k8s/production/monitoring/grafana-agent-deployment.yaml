apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-agent
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: grafana-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-agent
  namespace: runtime-pool
  labels:
    app.kubernetes.io/name: grafana-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-agent
    spec:
      serviceAccountName: grafana-agent
      containers:
        - name: agent
          image: grafana/agent:v0.43.3
          args:
            - -config.file=/etc/agent/agent.yaml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/agent
            - name: secrets
              mountPath: /etc/agent/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 8080
              name: http-metrics
      volumes:
        - name: config
          configMap:
            name: grafana-agent-config
        - name: secrets
          secret:
            secretName: grafana-agent-secrets
