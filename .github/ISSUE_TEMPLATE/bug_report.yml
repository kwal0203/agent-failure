name: Bug report
description: Report a reproducible problem in Agent Failure.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private
        data, or security vulnerabilities in this public form.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Control plane
        - Agent runtime
        - Evaluator
        - Frontend
        - Kubernetes deployment
        - Documentation or setup
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit or release, operating system, Python and Node versions, and deployment mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, personal data, and infrastructure identifiers.
      render: shell
