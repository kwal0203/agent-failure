name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Optional commit SHA to build and release (defaults to current main HEAD)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-staging-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: kwal0203
  CONTROL_PLANE_IMAGE: ghcr.io/kwal0203/agent-failure-control-plane
  RUNTIME_IMAGE_REPO: agent-failure-runtime-v1
  CONTROL_PLANE_VERSION: "0.1.0"
  LAB_SLUG: agent
  LAB_VERSION: "0.1.0"
  AGENT_TARGET_LABS: agent-prompt-injection,agent-tool-misuse,agent-memory-poisoning
  STAGING_MANIFESTS: deploy/k8s/staging
  STAGING_NAMESPACE: runtime-pool

jobs:
  release-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: staging
    env:
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Resolve target commit
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.git_sha }}" ]]; then
              echo "sha=${{ inputs.git_sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "sha=main" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=${EVENT_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        run: |
          GIT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_ts=${BUILD_TS}" >> "$GITHUB_OUTPUT"

      - name: Build and push control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control_plane/Dockerfile
          push: true
          tags: |
            ${{ env.CONTROL_PLANE_IMAGE }}:v1-control-plane-${{ env.CONTROL_PLANE_VERSION }}
            ${{ env.CONTROL_PLANE_IMAGE }}:sha-${{ steps.meta.outputs.git_sha }}
          labels: |
            org.opencontainers.image.source=agent-failure
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtimes/${{ env.LAB_SLUG }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:v1-${{ env.LAB_SLUG }}-${{ env.LAB_VERSION }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:sha-${{ steps.meta.outputs.git_sha }}
          labels: |
            org.opencontainers.image.source=agent-failure
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_ts }}
            io.agent-failure.lab.slug=${{ env.LAB_SLUG }}
            io.agent-failure.lab.version=${{ env.LAB_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve digests
        id: digests
        run: |
          CP_DIGEST="$(docker buildx imagetools inspect \
            '${{ env.CONTROL_PLANE_IMAGE }}:sha-${{ steps.meta.outputs.git_sha }}' \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "cp=${CP_DIGEST}" >> "$GITHUB_OUTPUT"

          RT_DIGEST="$(docker buildx imagetools inspect \
            '${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:sha-${{ steps.meta.outputs.git_sha }}' \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "rt=${RT_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Update staging manifests
        run: |
          .task/update_kustomization_digest.sh \
            "${{ env.STAGING_MANIFESTS }}/kustomization.yaml" \
            "${{ env.CONTROL_PLANE_IMAGE }}" \
            "${{ steps.digests.outputs.cp }}"

          RT_IMAGE_BASE="${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}"
          RT_DIGEST_REF="${RT_IMAGE_BASE}@${{ steps.digests.outputs.rt }}"
          .task/update_runtime_lock.sh \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock" \
            "${RT_IMAGE_BASE}" \
            "${RT_DIGEST_REF}" \
            "${{ steps.meta.outputs.git_sha }}" \
            "${{ steps.meta.outputs.build_ts }}" \
            "${{ env.AGENT_TARGET_LABS }}"
          .task/validate_runtime_lock.sh \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock" \
            "${{ env.AGENT_TARGET_LABS }}"

      - name: Commit and push staging manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "${{ env.STAGING_MANIFESTS }}/kustomization.yaml" \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No staging manifest changes"
            exit 0
          fi
          git commit -m "cd(staging): update image digests for ${{ steps.meta.outputs.git_sha }}"
          git push origin HEAD:main

      - name: Wait for staging health endpoint
        env:
          API_BASE: ${{ secrets.STAGING_API_BASE }}
        run: |
          if [[ -z "${API_BASE}" ]]; then
            echo "Missing required secret: STAGING_API_BASE"
            exit 1
          fi

          for i in {1..30}; do
            health_code="$(curl -sS -o /tmp/staging_healthz.out -w '%{http_code}' "${API_BASE}/healthz" || true)"
            if [[ "${health_code}" == "200" ]]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Waiting for staging healthz (attempt ${i}/30, status=${health_code})"
            sleep 10
          done

          echo "Health check failed: ${API_BASE}/healthz (http=${health_code})"
          if [[ -s /tmp/staging_healthz.out ]]; then
            cat /tmp/staging_healthz.out
          fi
          exit 1

      - name: Generate staging auth header
        env:
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_COGNITO_CLIENT_ID: ${{ secrets.STAGING_COGNITO_CLIENT_ID }}
          STAGING_COGNITO_USER_POOL_ID: ${{ secrets.STAGING_COGNITO_USER_POOL_ID }}
        run: |
          if [[ -z "${STAGING_TEST_EMAIL}" || -z "${STAGING_TEST_PASSWORD}" || -z "${STAGING_COGNITO_CLIENT_ID}" || -z "${STAGING_COGNITO_USER_POOL_ID}" ]]; then
            echo "Missing required staging auth secrets: STAGING_TEST_EMAIL, STAGING_TEST_PASSWORD, STAGING_COGNITO_CLIENT_ID, STAGING_COGNITO_USER_POOL_ID"
            exit 1
          fi

          STAGING_COGNITO_REGION="${STAGING_COGNITO_USER_POOL_ID%%_*}"
          if [[ -z "${STAGING_COGNITO_REGION}" || "${STAGING_COGNITO_REGION}" == "${STAGING_COGNITO_USER_POOL_ID}" ]]; then
            echo "Invalid STAGING_COGNITO_USER_POOL_ID format: expected <region>_<poolId>"
            exit 1
          fi

          AUTH_PAYLOAD="$(curl -sS -X POST "https://cognito-idp.${STAGING_COGNITO_REGION}.amazonaws.com/" \
            -H "Content-Type: application/x-amz-json-1.1" \
            -H "X-Amz-Target: AWSCognitoIdentityProviderService.InitiateAuth" \
            --data "{\"AuthFlow\":\"USER_PASSWORD_AUTH\",\"ClientId\":\"${STAGING_COGNITO_CLIENT_ID}\",\"AuthParameters\":{\"USERNAME\":\"${STAGING_TEST_EMAIL}\",\"PASSWORD\":\"${STAGING_TEST_PASSWORD}\"}}")"
          export AUTH_PAYLOAD

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ["AUTH_PAYLOAD"])
          auth = payload.get("AuthenticationResult") or {}
          token = auth.get("AccessToken")
          if not token:
              challenge = payload.get("ChallengeName")
              if challenge:
                  print(f"Cognito returned challenge instead of token: {challenge}", file=sys.stderr)
              else:
                  print(f"Cognito auth failed payload: {payload}", file=sys.stderr)
              raise SystemExit(1)
          print(token)
          PY
          )"

          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "Failed to resolve Cognito access token"
            exit 1
          fi
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "SMOKE_AUTH_HEADER=Bearer ${ACCESS_TOKEN}" >> "$GITHUB_ENV"

      - name: Basic session smoke (API only)
        env:
          API_BASE: ${{ secrets.STAGING_API_BASE }}
          AUTH_HEADER: ${{ env.SMOKE_AUTH_HEADER }}
        run: |
          if [[ -z "${AUTH_HEADER}" ]]; then
            echo "Missing generated staging auth header"
            exit 1
          fi

          IDEM_KEY="cd-staging-${{ github.run_id }}-${{ github.run_attempt }}-$(date +%s)"
          CREATE_BODY="$(mktemp)"
          CREATE_CODE="$(
            curl -sS -o "${CREATE_BODY}" -w "%{http_code}" \
              -X POST "${API_BASE}/api/v1/sessions" \
              -H "Authorization: ${AUTH_HEADER}" \
              -H "Idempotency-Key: ${IDEM_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"lab_id":"44444444-4444-4444-4444-444444444444","lab_difficulty":"medium"}'
          )"
          if [[ "${CREATE_CODE}" != "202" ]]; then
            echo "Session create smoke failed (http=${CREATE_CODE})"
            cat "${CREATE_BODY}"
            rm -f "${CREATE_BODY}"
            exit 1
          fi

          SESSION_ID="$(python3 - <<PY
          import json
          with open("${CREATE_BODY}", "r", encoding="utf-8") as f:
              payload = json.load(f)
          print(payload["session"]["id"])
          PY
          )"
          rm -f "${CREATE_BODY}"
          if [[ -z "${SESSION_ID}" ]]; then
            echo "Session create smoke failed: missing session id"
            exit 1
          fi

          STOP_CODE="$(
            curl -sS -o /tmp/staging_smoke_stop.out -w "%{http_code}" \
              -X POST "${API_BASE}/api/v1/sessions/${SESSION_ID}/stop" \
              -H "Authorization: ${AUTH_HEADER}" \
              -H "Content-Type: application/json"
          )"
          if [[ "${STOP_CODE}" != "202" ]]; then
            echo "Session stop smoke failed (http=${STOP_CODE}) session_id=${SESSION_ID}"
            if [[ -s /tmp/staging_smoke_stop.out ]]; then
              cat /tmp/staging_smoke_stop.out
            fi
            exit 1
          fi

      - name: Capture migration head (repo)
        id: migration
        run: |
          ALEMBIC_HEAD="$(python3 - <<'PY'
          import glob
          import pathlib
          import re

          files = glob.glob("alembic/versions/*.py")
          revisions = {}
          down_revs = set()

          for f in files:
              text = pathlib.Path(f).read_text(encoding="utf-8")
              rev_match = re.search(r"^revision\s*(?::[^=]+)?=\s*['\"]([^'\"]+)['\"]", text, re.M)
              if not rev_match:
                  continue
              rev = rev_match.group(1)
              revisions[rev] = f

              down_match = re.search(r"^down_revision\s*(?::[^=]+)?=\s*(.+)$", text, re.M)
              if not down_match:
                  continue
              raw = down_match.group(1).strip()
              if raw == "None":
                  continue
              for dep in re.findall(r"['\"]([^'\"]+)['\"]", raw):
                  down_revs.add(dep)

          heads = sorted(set(revisions.keys()) - down_revs)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly 1 migration head, found {len(heads)}: {heads}")
          print(heads[0])
          PY
          )"
          if [[ -z "${ALEMBIC_HEAD}" ]]; then
            echo "Unable to resolve alembic head revision from repository"
            exit 1
          fi
          echo "head=${ALEMBIC_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Write release metadata artifact
        run: |
          mkdir -p .artifacts
          cat > .artifacts/staging-release-metadata.json <<EOF
          {
            "workflow": "cd-staging",
            "environment": "staging",
            "commit_short_sha": "${{ steps.meta.outputs.git_sha }}",
            "commit_full_sha": "${{ steps.meta.outputs.full_sha }}",
            "control_plane_image": "${{ env.CONTROL_PLANE_IMAGE }}@${{ steps.digests.outputs.cp }}",
            "runtime_image": "${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}@${{ steps.digests.outputs.rt }}",
            "alembic_head": "${{ steps.migration.outputs.head }}",
            "built_at_utc": "${{ steps.meta.outputs.build_ts }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          EOF
          cat .artifacts/staging-release-metadata.json

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-metadata-${{ steps.meta.outputs.git_sha }}
          path: .artifacts/staging-release-metadata.json
