name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Optional commit SHA to build and release (defaults to current main HEAD)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-staging-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: kwal0203
  CONTROL_PLANE_IMAGE: ghcr.io/kwal0203/agent-failure-control-plane
  RUNTIME_IMAGE_REPO: agent-failure-runtime-v1
  CONTROL_PLANE_VERSION: "0.1.0"
  LAB_SLUG: agent
  LAB_VERSION: "0.1.0"
  AGENT_TARGET_LABS: agent-prompt-injection,agent-tool-misuse,agent-memory-poisoning
  STAGING_MANIFESTS: deploy/k8s/staging
  STAGING_NAMESPACE: runtime-pool
  STAGING_FLUX_NAMESPACE: flux-system
  STAGING_FLUX_KUSTOMIZATION: flux-system

jobs:
  release-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: staging
    env:
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Resolve target commit
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.git_sha }}" ]]; then
              echo "sha=${{ inputs.git_sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "sha=main" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=${EVENT_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        run: |
          GIT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_ts=${BUILD_TS}" >> "$GITHUB_OUTPUT"

      - name: Build and push control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control_plane/Dockerfile
          push: true
          tags: |
            ${{ env.CONTROL_PLANE_IMAGE }}:v1-control-plane-${{ env.CONTROL_PLANE_VERSION }}
            ${{ env.CONTROL_PLANE_IMAGE }}:sha-${{ steps.meta.outputs.git_sha }}
          labels: |
            org.opencontainers.image.source=agent-failure
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtimes/${{ env.LAB_SLUG }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:v1-${{ env.LAB_SLUG }}-${{ env.LAB_VERSION }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:sha-${{ steps.meta.outputs.git_sha }}
          labels: |
            org.opencontainers.image.source=agent-failure
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_ts }}
            io.agent-failure.lab.slug=${{ env.LAB_SLUG }}
            io.agent-failure.lab.version=${{ env.LAB_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve digests
        id: digests
        run: |
          CP_DIGEST="$(docker buildx imagetools inspect \
            '${{ env.CONTROL_PLANE_IMAGE }}:sha-${{ steps.meta.outputs.git_sha }}' \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "cp=${CP_DIGEST}" >> "$GITHUB_OUTPUT"

          RT_DIGEST="$(docker buildx imagetools inspect \
            '${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}:sha-${{ steps.meta.outputs.git_sha }}' \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "rt=${RT_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Update staging manifests
        run: |
          .task/update_kustomization_digest.sh \
            "${{ env.STAGING_MANIFESTS }}/kustomization.yaml" \
            "${{ env.CONTROL_PLANE_IMAGE }}" \
            "${{ steps.digests.outputs.cp }}"

          RT_IMAGE_BASE="${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}"
          RT_DIGEST_REF="${RT_IMAGE_BASE}@${{ steps.digests.outputs.rt }}"
          .task/update_runtime_lock.sh \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock" \
            "${RT_IMAGE_BASE}" \
            "${RT_DIGEST_REF}" \
            "${{ steps.meta.outputs.git_sha }}" \
            "${{ steps.meta.outputs.build_ts }}" \
            "${{ env.AGENT_TARGET_LABS }}"
          .task/validate_runtime_lock.sh \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock" \
            "${{ env.AGENT_TARGET_LABS }}"

      - name: Commit and push staging manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "${{ env.STAGING_MANIFESTS }}/kustomization.yaml" \
            "${{ env.STAGING_MANIFESTS }}/runtime-image.lock"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No staging manifest changes"
            exit 0
          fi
          git commit -m "cd(staging): update image digests for ${{ steps.meta.outputs.git_sha }}"
          git push origin HEAD:main

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install flux CLI
        uses: fluxcd/flux2/action@main

      - name: Configure kubeconfig
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          if [[ -z "${STAGING_KUBECONFIG_B64}" ]]; then
            echo "Missing required secret: STAGING_KUBECONFIG_B64"
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          echo "${STAGING_KUBECONFIG_B64}" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Wait for Flux reconciliation
        run: |
          flux reconcile source git "${{ env.STAGING_FLUX_KUSTOMIZATION }}" -n "${{ env.STAGING_FLUX_NAMESPACE }}" || true
          flux reconcile kustomization "${{ env.STAGING_FLUX_KUSTOMIZATION }}" -n "${{ env.STAGING_FLUX_NAMESPACE }}" --with-source
          flux get kustomizations -n "${{ env.STAGING_FLUX_NAMESPACE }}"

      - name: Staging rollout and migration smoke
        env:
          NS: ${{ env.STAGING_NAMESPACE }}
          FLUX_NS: ${{ env.STAGING_FLUX_NAMESPACE }}
          KUSTOMIZATION_NAME: ${{ env.STAGING_FLUX_KUSTOMIZATION }}
          API_BASE: ${{ secrets.STAGING_API_BASE }}
          ROLLOUT_TIMEOUT: 240s
        run: |
          if [[ -z "${API_BASE}" ]]; then
            echo "Missing required secret: STAGING_API_BASE"
            exit 1
          fi

          kubectl get ns "${NS}" >/dev/null

          for d in \
            control-plane \
            control-plane-provisioning-worker \
            control-plane-cleanup-worker; do
            echo "Checking deployment/${d}"
            kubectl -n "${NS}" rollout status "deploy/${d}" --timeout="${ROLLOUT_TIMEOUT}"
          done

          health_code="$(curl -sS -o /tmp/staging_healthz.out -w '%{http_code}' "${API_BASE}/healthz" || true)"
          if [[ "${health_code}" != "200" ]]; then
            echo "Health check failed: ${API_BASE}/healthz (http=${health_code})"
            if [[ -s /tmp/staging_healthz.out ]]; then
              cat /tmp/staging_healthz.out
            fi
            exit 1
          fi

      - name: Basic session smoke
        env:
          NS: ${{ env.STAGING_NAMESPACE }}
          API_BASE: ${{ secrets.STAGING_API_BASE }}
          AUTH_HEADER: ${{ secrets.STAGING_AUTH_HEADER }}
          PROVISION_TIMEOUT: 120
          CLEANUP_TIMEOUT: 180
        run: |
          if [[ -z "${AUTH_HEADER}" ]]; then
            echo "Missing required secret: STAGING_AUTH_HEADER"
            exit 1
          fi
          ./scripts/smoke_session_roundtrip.sh 1 1

      - name: Capture migration head
        id: migration
        run: |
          ALEMBIC_HEAD="$(kubectl -n "${{ env.STAGING_NAMESPACE }}" exec deploy/control-plane -c control-plane -- uv run alembic current | tail -n 1 | awk '{print $1}')"
          if [[ -z "${ALEMBIC_HEAD}" ]]; then
            echo "Unable to resolve alembic head revision from staging"
            exit 1
          fi
          echo "head=${ALEMBIC_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Write release metadata artifact
        run: |
          mkdir -p .artifacts
          cat > .artifacts/staging-release-metadata.json <<EOF
          {
            "workflow": "cd-staging",
            "environment": "staging",
            "commit_short_sha": "${{ steps.meta.outputs.git_sha }}",
            "commit_full_sha": "${{ steps.meta.outputs.full_sha }}",
            "control_plane_image": "${{ env.CONTROL_PLANE_IMAGE }}@${{ steps.digests.outputs.cp }}",
            "runtime_image": "${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.RUNTIME_IMAGE_REPO }}@${{ steps.digests.outputs.rt }}",
            "alembic_head": "${{ steps.migration.outputs.head }}",
            "built_at_utc": "${{ steps.meta.outputs.build_ts }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          EOF
          cat .artifacts/staging-release-metadata.json

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-metadata-${{ steps.meta.outputs.git_sha }}
          path: .artifacts/staging-release-metadata.json
