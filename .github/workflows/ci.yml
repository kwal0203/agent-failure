name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/k8s/**"
      - "deploy/releases/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: agent_failure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_failure_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:localdev@localhost/agent_failure_test
      DATABASE_URL: postgresql+psycopg://postgres:localdev@localhost/agent_failure_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install backend deps
        run: uv sync --frozen --group dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/frontend

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run biome
        run: npm run biome:check
        working-directory: apps/frontend

      - name: Run webcheck
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Run mypy
        run: uv run mypy .

      - name: Run Pyright
        run: uv run pyright

      - name: Unit tests
        run: uv run python -m pytest -q -m "not integration"
