name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: agent_failure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_failure_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: dev
      TEST_DATABASE_URL: postgresql+psycopg://postgres:localdev@localhost/agent_failure_test
      DATABASE_URL: postgresql+psycopg://postgres:localdev@localhost/agent_failure_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install backend deps
        run: uv sync --frozen --group dev

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/frontend

      - name: Audit Python production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --output-file /tmp/agent-failure-requirements.txt
          uv run pip-audit --progress-spinner off --require-hashes \
            --requirement /tmp/agent-failure-requirements.txt

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/frontend

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Verify generated API client
        run: npm run api:check
        working-directory: apps/frontend

      - name: Run biome
        run: npm run biome:check
        working-directory: apps/frontend

      - name: Run frontend typecheck
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: apps/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: apps/frontend

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run Pyright
        run: uv run pyright

      - name: Backend tests
        run: uv run python -m pytest -q

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s/base >/dev/null
          kubectl kustomize deploy/k8s/dev >/dev/null
          kubectl kustomize deploy/k8s/staging >/dev/null
          kubectl kustomize deploy/k8s/production >/dev/null
