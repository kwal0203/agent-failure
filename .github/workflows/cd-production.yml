name: CD Production

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: "Full commit SHA for the staged release metadata to promote"
        required: true
        type: string
      reason:
        description: "Optional promotion note"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cd-production-main
  cancel-in-progress: false

env:
  CONTROL_PLANE_IMAGE: ghcr.io/kwal0203/agent-failure-control-plane
  STAGING_RELEASES: deploy/releases/staging
  PRODUCTION_MANIFESTS: deploy/k8s/production
  AGENT_TARGET_LABS: agent-prompt-injection,agent-tool-misuse,agent-memory-poisoning

jobs:
  promote-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve staged release metadata
        id: staged
        run: |
          release_file="${STAGING_RELEASES}/${{ inputs.release_commit }}.json"
          if [[ ! -f "${release_file}" ]]; then
            echo "Release metadata file not found: ${release_file}"
            exit 1
          fi

          cp_ref="$(jq -r '.control_plane_image' "${release_file}")"
          runtime_ref="$(jq -r '.runtime_image' "${release_file}")"
          build_git_sha="$(jq -r '.commit_short_sha' "${release_file}")"
          build_ts="$(jq -r '.built_at_utc' "${release_file}")"

          if [[ -z "${cp_ref}" || "${cp_ref}" == "null" ]]; then
            echo "Invalid control_plane_image in ${release_file}"
            exit 1
          fi
          if [[ -z "${runtime_ref}" || "${runtime_ref}" == "null" ]]; then
            echo "Invalid runtime_image in ${release_file}"
            exit 1
          fi

          cp_digest="${cp_ref##*@}"
          runtime_base="${runtime_ref%@*}"
          runtime_digest="${runtime_ref##*@}"

          if ! [[ "${cp_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid staged control-plane digest: ${cp_digest}"
            exit 1
          fi
          if ! [[ "${runtime_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid staged runtime digest: ${runtime_digest}"
            exit 1
          fi

          echo "cp=${cp_digest}" >> "$GITHUB_OUTPUT"
          cp_sanitized="${cp_digest//:/-}"
          echo "cp_sanitized=${cp_sanitized}" >> "$GITHUB_OUTPUT"
          echo "runtime_ref=${runtime_ref}" >> "$GITHUB_OUTPUT"
          echo "runtime_base=${runtime_base}" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=${runtime_digest}" >> "$GITHUB_OUTPUT"
          echo "build_git_sha=${build_git_sha}" >> "$GITHUB_OUTPUT"
          echo "build_ts=${build_ts}" >> "$GITHUB_OUTPUT"
          echo "release_file=${release_file}" >> "$GITHUB_OUTPUT"

      - name: Apply production manifest updates
        env:
          CP_DIGEST: ${{ steps.staged.outputs.cp }}
          RUNTIME_BASE: ${{ steps.staged.outputs.runtime_base }}
          RUNTIME_REF: ${{ steps.staged.outputs.runtime_ref }}
        run: |
          .task/update_kustomization_digest.sh \
            "${PRODUCTION_MANIFESTS}/kustomization.yaml" \
            "${CONTROL_PLANE_IMAGE}" \
            "${CP_DIGEST}"

          .task/update_runtime_lock.sh \
            "${PRODUCTION_MANIFESTS}/runtime-image.lock" \
            "${RUNTIME_BASE}" \
            "${RUNTIME_REF}" \
            "${{ steps.staged.outputs.build_git_sha }}" \
            "${{ steps.staged.outputs.build_ts }}" \
            "${AGENT_TARGET_LABS}" \
            "production"

          .task/validate_runtime_lock.sh \
            "${PRODUCTION_MANIFESTS}/runtime-image.lock" \
            "${AGENT_TARGET_LABS}"

      - name: Commit production promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "${PRODUCTION_MANIFESTS}/kustomization.yaml" \
            "${PRODUCTION_MANIFESTS}/runtime-image.lock"

          if git diff --cached --quiet; then
            echo "No production manifest changes; already at staged digests."
            exit 0
          fi

          msg="cd(production): promote digests from staging cp=${{ steps.staged.outputs.cp }} rt=${{ steps.staged.outputs.runtime_digest }}"
          if [[ -n "${{ inputs.reason }}" ]]; then
            msg+=" | reason: ${{ inputs.reason }}"
          fi

          git commit -m "$msg"

      - name: Open PR for production manifest promotion
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PR_CREATOR_TOKEN }}
          base: main
          branch: automation/cd-production-${{ steps.staged.outputs.cp_sanitized }}
          delete-branch: true
          title: "cd(production): promote digests from staging"
          body: |
            Automated production manifest promotion from staged release metadata.

            - control-plane digest: `${{ steps.staged.outputs.cp }}`
            - runtime digest: `${{ steps.staged.outputs.runtime_digest }}`
            - release metadata: `${{ steps.staged.outputs.release_file }}`
            - reason: `${{ inputs.reason }}`
          commit-message: "cd(production): promote digests from staging cp=${{ steps.staged.outputs.cp }} rt=${{ steps.staged.outputs.runtime_digest }}"
          add-paths: |
            ${{ env.PRODUCTION_MANIFESTS }}/kustomization.yaml
            ${{ env.PRODUCTION_MANIFESTS }}/runtime-image.lock
          labels: |
            automation
            production
