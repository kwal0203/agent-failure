version: "3"

dotenv:
  - .env

vars:
  STAGING_MANIFESTS: deploy/k8s/staging
  DEV_MANIFESTS: deploy/k8s/dev

env:
  KUBECONFIG:
    sh: echo "${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"

tasks:
  cd:build-lock:
    desc: Build+push control-plane/runtime images and update staging image digests locally
    requires:
      vars:
        - GHCR_USERNAME
    preconditions:
      - sh: command -v docker
        msg: "docker not found"
      - sh: command -v git
        msg: "git not found"
    vars:
      REGISTRY: ghcr.io
      ORG: kwal0203
      CONTROL_PLANE_IMAGE: ghcr.io/kwal0203/agent-failure-control-plane
      CONTROL_PLANE_VERSION: "0.1.0"
      RUNTIME_IMAGE_REPO: agent-failure-runtime-v1
      LAB_SLUG: agent
      LAB_VERSION: "0.1.0"
      AGENT_TARGET_LABS: agent-prompt-injection,agent-tool-misuse,agent-memory-poisoning
      GIT_SHA:
        sh: git rev-parse --short HEAD
      BUILD_TS:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - |
        if [ -z "${GHCR_TOKEN:-}" ]; then
          echo "Missing GHCR_TOKEN"
          exit 1
        fi
        echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
      - |
        docker buildx build \
          --platform linux/amd64 \
          --file apps/control_plane/Dockerfile \
          --tag {{.CONTROL_PLANE_IMAGE}}:v1-control-plane-{{.CONTROL_PLANE_VERSION}} \
          --tag {{.CONTROL_PLANE_IMAGE}}:sha-{{.GIT_SHA}} \
          --label org.opencontainers.image.source=agent-failure \
          --label org.opencontainers.image.revision={{.GIT_SHA}} \
          --label org.opencontainers.image.created={{.BUILD_TS}} \
          --push \
          .
      - |
        docker buildx build \
          --platform linux/amd64 \
          --file runtimes/{{.LAB_SLUG}}/Dockerfile \
          --tag {{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}:v1-{{.LAB_SLUG}}-{{.LAB_VERSION}} \
          --tag {{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}:sha-{{.GIT_SHA}} \
          --label org.opencontainers.image.source=agent-failure \
          --label org.opencontainers.image.revision={{.GIT_SHA}} \
          --label org.opencontainers.image.created={{.BUILD_TS}} \
          --label io.agent-failure.lab.slug={{.LAB_SLUG}} \
          --label io.agent-failure.lab.version={{.LAB_VERSION}} \
          --push \
          .
      - |
        CP_DIGEST="$(docker buildx imagetools inspect \
          '{{.CONTROL_PLANE_IMAGE}}:sha-{{.GIT_SHA}}' \
          --format '{{"{{json .Manifest.Digest}}"}}' | tr -d '"')" && \
        .task/update_kustomization_digest.sh \
          "{{.STAGING_MANIFESTS}}/kustomization.yaml" \
          "{{.CONTROL_PLANE_IMAGE}}" \
          "${CP_DIGEST}"
      - |
        RT_IMAGE_BASE="{{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}" && \
        RT_DIGEST="$(docker buildx imagetools inspect \
          "${RT_IMAGE_BASE}:sha-{{.GIT_SHA}}" \
          --format '{{"{{json .Manifest.Digest}}"}}' | tr -d '"')" && \
        RT_DIGEST_REF="${RT_IMAGE_BASE}@${RT_DIGEST}" && \
        .task/update_runtime_lock.sh \
          "{{.STAGING_MANIFESTS}}/runtime-image.lock" \
          "${RT_IMAGE_BASE}" \
          "${RT_DIGEST_REF}" \
          "{{.GIT_SHA}}" \
          "{{.BUILD_TS}}" \
          "{{.AGENT_TARGET_LABS}}" \
          "staging" && \
        .task/validate_runtime_lock.sh \
          "{{.STAGING_MANIFESTS}}/runtime-image.lock" \
          "{{.AGENT_TARGET_LABS}}"
      - echo "Updated manifests for git sha {{.GIT_SHA}}"

  cd:build-lock:dev:
    desc: Build+push control-plane/runtime images and update dev image digests locally
    requires:
      vars:
        - GHCR_USERNAME
    preconditions:
      - sh: command -v docker
        msg: "docker not found"
      - sh: command -v git
        msg: "git not found"
    vars:
      REGISTRY: ghcr.io
      ORG: kwal0203
      CONTROL_PLANE_IMAGE: ghcr.io/kwal0203/agent-failure-control-plane
      CONTROL_PLANE_VERSION: "0.1.0"
      RUNTIME_IMAGE_REPO: agent-failure-runtime-v1
      LAB_SLUG: agent
      LAB_VERSION: "0.1.0"
      AGENT_TARGET_LABS: agent-prompt-injection,agent-tool-misuse,agent-memory-poisoning
      GIT_SHA:
        sh: git rev-parse --short HEAD
      BUILD_TS:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - |
        if [ -z "${GHCR_TOKEN:-}" ]; then
          echo "Missing GHCR_TOKEN"
          exit 1
        fi
        echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
      - |
        docker buildx build \
          --platform linux/amd64 \
          --file apps/control_plane/Dockerfile \
          --tag {{.CONTROL_PLANE_IMAGE}}:v1-control-plane-{{.CONTROL_PLANE_VERSION}} \
          --tag {{.CONTROL_PLANE_IMAGE}}:sha-{{.GIT_SHA}} \
          --label org.opencontainers.image.source=agent-failure \
          --label org.opencontainers.image.revision={{.GIT_SHA}} \
          --label org.opencontainers.image.created={{.BUILD_TS}} \
          --push \
          .
      - |
        docker buildx build \
          --platform linux/amd64 \
          --file runtimes/{{.LAB_SLUG}}/Dockerfile \
          --tag {{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}:v1-{{.LAB_SLUG}}-{{.LAB_VERSION}} \
          --tag {{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}:sha-{{.GIT_SHA}} \
          --label org.opencontainers.image.source=agent-failure \
          --label org.opencontainers.image.revision={{.GIT_SHA}} \
          --label org.opencontainers.image.created={{.BUILD_TS}} \
          --label io.agent-failure.lab.slug={{.LAB_SLUG}} \
          --label io.agent-failure.lab.version={{.LAB_VERSION}} \
          --push \
          .
      - |
        CP_DIGEST="$(docker buildx imagetools inspect \
          '{{.CONTROL_PLANE_IMAGE}}:sha-{{.GIT_SHA}}' \
          --format '{{"{{json .Manifest.Digest}}"}}' | tr -d '"')" && \
        .task/update_kustomization_digest.sh \
          "{{.DEV_MANIFESTS}}/kustomization.yaml" \
          "{{.CONTROL_PLANE_IMAGE}}" \
          "${CP_DIGEST}"
      - |
        RT_IMAGE_BASE="{{.REGISTRY}}/{{.ORG}}/{{.RUNTIME_IMAGE_REPO}}" && \
        RT_DIGEST="$(docker buildx imagetools inspect \
          "${RT_IMAGE_BASE}:sha-{{.GIT_SHA}}" \
          --format '{{"{{json .Manifest.Digest}}"}}' | tr -d '"')" && \
        RT_DIGEST_REF="${RT_IMAGE_BASE}@${RT_DIGEST}" && \
        .task/update_runtime_lock.sh \
          "{{.DEV_MANIFESTS}}/runtime-image.lock" \
          "${RT_IMAGE_BASE}" \
          "${RT_DIGEST_REF}" \
          "{{.GIT_SHA}}" \
          "{{.BUILD_TS}}" \
          "{{.AGENT_TARGET_LABS}}" \
          "dev" && \
        .task/validate_runtime_lock.sh \
          "{{.DEV_MANIFESTS}}/runtime-image.lock" \
          "{{.AGENT_TARGET_LABS}}"
      - echo "Updated dev manifests for git sha {{.GIT_SHA}}"

  bootstrap:
    desc: Bootstrap k3s cluster with namespaces, secrets, and manifests
    preconditions:
      - sh: command -v k3s
        msg: "k3s not found. Install: curl -sfL https://get.k3s.io | sh -"
      - sh: command -v kubectl
        msg: "kubectl not found"
      - sh: test -r ${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}
        msg: "Cannot read KUBECONFIG. Fix: sudo chmod 644 /etc/rancher/k3s/k3s.yaml"
    cmds:
      - task: bootstrap:secrets
      - 'echo "Done. Install Flux with: flux bootstrap github --owner=kwal0203 --repository=agent-failure --branch=main --path=deploy/k8s/staging --personal"'

  bootstrap:reset:
    desc: Wipe k3s cluster and bootstrap from scratch (needs sudo)
    preconditions:
      - sh: command -v k3s
        msg: "k3s not found"
    cmds:
      - sudo k3s server --cluster-reset
      - sudo systemctl restart k3s
      - echo "Waiting for k3s to be ready..."
      - sleep 10
      - task: bootstrap

  bootstrap:secrets:
    desc: Create/update image pull secret and runtime secrets
    internal: true
    requires:
      vars:
        - GHCR_USERNAME
        - GHCR_TOKEN
        - GHCR_EMAIL
        - DATABASE_URL
        - OPENROUTER_API_KEY
        - RUNTIME_SHARED_TOKEN
        - AUTH_ISSUER
        - AUTH_AUDIENCE
        - AUTH_JWKS_URI
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl not found"
    cmds:
      - kubectl apply -f {{.STAGING_MANIFESTS}}/namespaces.yaml
      - kubectl apply -f {{.STAGING_MANIFESTS}}/control-plane-worker-rbac.yaml
      - |
        kubectl -n runtime-pool create secret docker-registry ghcr-pull \
          --docker-server=ghcr.io \
          --docker-username={{.GHCR_USERNAME}} \
          --docker-password={{.GHCR_TOKEN}} \
          --docker-email={{.GHCR_EMAIL}} \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl -n runtime-pool create secret generic runtime-secrets \
          --from-literal=DATABASE_URL="{{.DATABASE_URL}}" \
          --from-literal=OPENROUTER_API_KEY="{{.OPENROUTER_API_KEY}}" \
          --from-literal=RUNTIME_SHARED_TOKEN="{{.RUNTIME_SHARED_TOKEN}}" \
          --from-literal=AUTH_ISSUER="{{.AUTH_ISSUER}}" \
          --from-literal=AUTH_AUDIENCE="{{.AUTH_AUDIENCE}}" \
          --from-literal=AUTH_JWKS_URI="{{.AUTH_JWKS_URI}}" \
          --dry-run=client -o yaml | kubectl apply -f -
